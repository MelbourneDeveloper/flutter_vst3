name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VST3_SDK_TAG: v3.8.1_build_84

jobs:
  duplication:
    name: Deslop duplication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Nimblesite/Deslop@v0.38.0
        with:
          nohtml: true
          upload-artifact: false

  flutter-vst3:
    name: flutter_vst3 analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: flutter_vst3
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_vst3
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: flutter_vst3
        run: flutter test

  plugin-tests:
    name: ${{ matrix.plugin }} analyze and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [echo, flutter_reverb]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: vsts/${{ matrix.plugin }}
        run: flutter pub get
      - name: Analyze
        working-directory: vsts/${{ matrix.plugin }}
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: vsts/${{ matrix.plugin }}
        run: flutter test

  ipc:
    name: IPC round trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: flutter_vst3
        run: flutter pub get
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.bat test-native
      - name: Run on Linux and macOS
        if: runner.os != 'Windows'
        run: bash flutter_vst3/test/native/run.sh

  view-logic:
    name: editor logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: bash flutter_vst3/test/native/run_view_logic.sh

  makefile:
    name: make test failure propagation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: bash dart_vst_host/test/native/harness_test.sh

  plugin-e2e:
    name: Echo and validator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Resolve dependencies
        working-directory: vsts/echo
        run: flutter pub get
      - name: Run
        shell: bash
        run: bash flutter_vst3/test/native/run_plugin_e2e.sh

  editor-e2e:
    name: Flutter editor in a test host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run
        shell: bash
        run: bash flutter_vst3/test/native/run_editor_e2e.sh

  native:
    name: host and graph libraries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - name: Test
        run: make test-host test-graph

  incremental-build:
    name: incremental worker rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - run: bash flutter_vst3/test/native/run_incremental_build.sh
      - run: python3 flutter_vst3/test/native/generator_strings_test.py

  windows-public-build:
    name: Windows public build and install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Public commands and installed workers
        shell: pwsh
        run: |
          foreach ($target in @('reverb', 'echo', 'install')) {
            & ./build.bat $target
            if ($LASTEXITCODE -ne 0) { throw "build.bat $target failed ($LASTEXITCODE)" }
          }
          foreach ($plugin in @('echo', 'flutter_reverb')) {
            $bundle = "$env:LOCALAPPDATA/Programs/Common/VST3/$plugin.vst3"
            if (-not (Test-Path $bundle -PathType Container)) { throw "Missing $bundle" }
            $workers = @(Get-ChildItem $bundle -Recurse -Filter "${plugin}_processor.exe")
            if ($workers.Count -ne 1) { throw "Expected one installed $plugin worker, got $($workers.Count)" }
          }

  editor-mutations:
    name: Editor mutation proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Kill editor mutants
        shell: bash
        run: bash flutter_vst3/test/native/run_editor_mutations.sh

  repository-rules:
    name: removed design and documentation regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/vst3-toolchain
      - run: python3 flutter_vst3/test/native/repo_rules_test.py
      - run: python3 flutter_vst3/test/native/build_rules_versions_test.py
      - run: make native dart-deps
      - run: make lint
      - run: python3 flutter_vst3/test/native/build_rules_make_test.py
      - run: python3 flutter_vst3/test/native/build_rules_flutter_test.py
      - run: python3 flutter_vst3/test/native/docs_commands_test.py

  ci:
    name: CI
    if: always()
    needs:
      - duplication
      - flutter-vst3
      - plugin-tests
      - ipc
      - view-logic
      - makefile
      - plugin-e2e
      - editor-e2e
      - native
      - incremental-build
      - windows-public-build
      - repository-rules
      - editor-mutations
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All required jobs succeeded
        run: echo "All required jobs succeeded."
