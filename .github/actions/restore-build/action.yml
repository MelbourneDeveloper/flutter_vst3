name: Restore the build
description: Restores what the Build job cached for this OS, and fails if it is missing.
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.BUILD_CACHE_PATHS }}
        key: build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
        fail-on-cache-miss: true
