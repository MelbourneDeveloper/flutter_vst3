name: VST3 toolchain
description: Installs Ninja and the Linux build libraries, and fetches the Steinberg VST3 SDK.
runs:
  using: composite
  steps:
    - name: Install Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build clang cmake pkg-config xvfb \
          libgtk-3-dev libgtkmm-3.0-dev libx11-dev libgl1-mesa-dri liblzma-dev
    - name: Install Ninja on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja
    - name: Install Ninja on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: choco install ninja --no-progress -y
    - name: Fetch the VST3 SDK
      shell: bash
      run: |
        git clone --depth 1 --recursive --shallow-submodules --branch "$VST3_SDK_TAG" \
          https://github.com/steinbergmedia/vst3sdk "$RUNNER_TEMP/vst3sdk"
        echo "VST3_SDK_DIR=$RUNNER_TEMP/vst3sdk" >> "$GITHUB_ENV"
